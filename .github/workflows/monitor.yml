name: Fixr ticket monitor

on:
  schedule:
    - cron: "0 7,12,17 * * *"
  workflow_dispatch: {}

concurrency:
  group: fixr-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll every 30 seconds for ~5h50m
        run: |
          END=$((SECONDS + 21000))
          while [ $SECONDS -lt $END ]; do
            python fixr_monitor.py
            sleep 30
          done

      - name: Save updated state
        run: |
          git config user.name "fixr-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if ! git diff --quiet --cached; then
            git commit -m "update state"
            git pull --rebase --autostash origin main || true
            git push || echo "::warning::Could not push updated state.json this run -- will retry next run."
          else
            echo "No state changes to commit."
          fi
